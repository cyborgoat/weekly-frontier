name: News archive
on:
  schedule:
    # 10:30 current-week updates and 11:30 previous-week finalization in LA.
    - cron: '30 17,18,19 * * *'
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [daily, generate]
        default: daily
      date:
        description: Collection date YYYY-MM-DD (optional; cannot reconstruct expired feed history)
      week_of:
        description: Monday date (optional; daily defaults to current week, generate to previous week)
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: news-archive
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          COMMAND: ${{ inputs.command }}
        run: python scripts/news_workflow.py mode
      - if: steps.mode.outputs.command != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          COMMAND: ${{ steps.mode.outputs.command }}
          COLLECTION_DATE: ${{ inputs.date }}
          WEEK: ${{ inputs.week_of }}
        run: |
          args=("$COMMAND")
          if [ -n "$COLLECTION_DATE" ]; then args+=(--date "$COLLECTION_DATE"); fi
          if [ -n "$WEEK" ]; then args+=(--week-of "$WEEK"); fi
          python scripts/news_workflow.py "${args[@]}"
