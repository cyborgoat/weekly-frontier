name: News archive
on:
  schedule:
    # Fixed UTC times. Mode maps cron → job by identity + intended UTC date.
    # Both target the current reporting week; generate also finalizes the prior week if still open.
    - cron: '0 6 * * *' # daily collect + current week (06:00 UTC)
    - cron: '0 7 * * *' # generate current week / finalize prior (07:00 UTC)
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [daily, generate]
        default: daily
      date:
        description: Collection/coverage day YYYY-MM-DD (UTC). Leave empty for today. Not the week Monday—use week_of for that.
      week_of:
        description: Reporting-week Monday YYYY-MM-DD (optional; defaults to the current week)
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: news-archive
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          COMMAND: ${{ inputs.command }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/news_workflow.py mode
      - if: steps.mode.outputs.command != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          COMMAND: ${{ steps.mode.outputs.command }}
          COLLECTION_DATE: ${{ inputs.date || steps.mode.outputs.date }}
          WEEK: ${{ inputs.week_of }}
        run: |
          args=("$COMMAND")
          if [ -n "$COLLECTION_DATE" ]; then args+=(--date "$COLLECTION_DATE"); fi
          if [ -n "$WEEK" ]; then args+=(--week-of "$WEEK"); fi
          python scripts/news_workflow.py "${args[@]}"
