name: Publish site
on:
  push:
    branches: [main]
    paths:
      - 'weekly/**'
      - 'topics/**'
      - 'assets/**'
      - 'site/**'
      - 'scripts/publish_feeds.py'
      - 'requirements.txt'
      - '.github/workflows/feeds.yaml'
  pull_request:
    paths:
      - 'weekly/**'
      - 'topics/**'
      - 'data/editions/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'site/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build magazine site
        working-directory: site
        run: npm run build
      - name: Merge publication feeds
        run: python scripts/publish_feeds.py --output site/out
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=weekly-frontier
